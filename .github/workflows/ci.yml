name : CI

on: 
  # push:
  #   branches: ["main"]
  # pull_request: 
  #   branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
    
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 
        with:
          enable-cache: true
      
      - name: Run Tests
        run: uv sync && ./scripts/run-tests.sh
  
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/shorturl:latest
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            set -e
            echo "Deploying to EC2..."
            export BASE_URL=${{vars.BASE_URL}}
            export CORS_ORIGINS=${{vars.CORS_ORIGINS}}
            export CACHE_TTL_SECONDS=${{vars.CACHE_TTL_SECONDS}}
            export RATE_LIMIT_PER_MINUTE=${{vars.RATE_LIMIT_PER_MINUTE}}
            export POSTGRES_HOST=${{vars.POSTGRES_HOST}}
            export POSTGRES_PORT=${{vars.POSTGRES_PORT}}
            export POSTGRES_USER=${{vars.POSTGRES_USER}}
            export POSTGRES_DB=${{vars.POSTGRES_DB}}
            export POSTGRES_PASSWORD=${{vars.POSTGRES_PASSWORD}}
            export REDIS_HOST=${{vars.REDIS_HOST}}
            export REDIS_PORT=${{vars.REDIS_PORT}}

            docker login -u ${{vars.DOCKERHUB_USERNAME}} -p ${{secrets.DOCKERHUB_TOKEN}}
            docker pull ${{vars.DOCKERHUB_USERNAME}}/shorturl:latest
            docker stop shorturl || true
            docker rm shorturl || true
            docker run -d --name shorturl -p 8000:8000 ${{vars.DOCKERHUB_USERNAME}}/shorturl:latest

            echo "Deployment completed successfully!"

    

      
      