name : CI

on: 
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
    
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 
        with:
          enable-cache: true
      
      - name: Run Tests
        run: uv sync && ./scripts/run-tests.sh
  
  build:
    if: false
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platform: linux/amd64,linux/arm64
          push: true
          tags: |
             ${{vars.DOCKERHUB_USERNAME}}/shorturl:latest
             ${{vars.DOCKERHUB_USERNAME}}/shorturl:${{github.sha}}
  
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{secrets.SSH_HOST}}
      SSH_USERNAME: ${{secrets.SSH_USERNAME}}
      APP_DIR: /home/ubuntu/deploy
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: SSH Setup
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST <<EOF
      
      - name: Write env file from GihHub Secrets
        
        env:
          BASE_URL: ${{vars.BASE_URL}} 
          CORS_ORIGINS: ${{vars.CORS_ORIGINS}} 
          CACHE_TTL_SECONDS: ${{vars.CACHE_TTL_SECONDS}} 
          RATE_LIMIT_PER_MINUTE: ${{vars.RATE_LIMIT_PER_MINUTE}} 
          POSTGRES_HOST: ${{vars.POSTGRES_HOST}} 
          POSTGRES_PORT: ${{vars.POSTGRES_PORT}} 
          POSTGRES_USER: ${{vars.POSTGRES_USER}} 
          POSTGRES_DB: ${{vars.POSTGRES_DB}} 
          POSTGRES_PASSWORD: ${{vars.POSTGRES_PASSWORD}} 
          REDIS_HOST: ${{vars.REDIS_HOST}} 
          REDIS_PORT: ${{vars.REDIS_PORT}} 
          APP_IMAGE: hindwar5155/shorturl:latest
        run: |
          cat <<EOF > .env
          BASE_URL: $BASE_URL
          CORS_ORIGINS: $CORS_ORIGINS
          CACHE_TTL_SECONDS: $CACHE_TTL_SECONDS
          RATE_LIMIT_PER_MINUTE: $RATE_LIMIT_PER_MINUTE
          POSTGRES_HOST: $POSTGRES_HOST
          POSTGRES_PORT: $POSTGRES_PORT
          POSTGRES_USER: $POSTGRES_USER
          POSTGRES_DB: $POSTGRES_DB
          POSTGRES_PASSWORD: $POSTGRES_PASSWORD
          REDIS_HOST: $REDIS_HOST
          REDIS_PORT: $REDIS_PORT
          APP_IMAGE: $APP_IMAGE
          EOF

      - name: Copy env file to EC2
        run: |
          scp .env docker-compose.yml $SSH_USERNAME@$SSH_HOST:$APP_DIR/
          rm .env

      - name: Deploy to EC2
        env:
          DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
        run: |
          ssh $SSH_USERNAME@$SSH_HOST \
           "APP_DIR='$APP_DIR' DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' bash -s" << 'REMOTE'
           cd "$APP_DIR" 
           chmod 600 .env
           echo $DOCKERHUB_TOKEN | docker login -u $DOCKERHUB_USERNAME --password-stdin
           docker compose pull
           docker logout $DOCKERHUB_USERNAME
           docker compose down
           docker compose up -d

           #wait for health check
           for i in {1..30}; do
           curl -s http://localhost:8000/api/health | grep -q "OK" && break
           done

      
      